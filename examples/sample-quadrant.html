<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ramen-cve quadrant report</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 24px; color: #222; }
h1 { font-size: 18px; margin: 0 0 8px; }
.meta { color: #666; font-size: 12px; margin: 0 0 16px; }
.chart { max-width: 720px; }
.legend { list-style: none; padding: 0; margin: 12px 0 0; font-size: 12px; }
.legend li { display: inline-block; margin-right: 16px; margin-bottom: 4px; }
.swatch { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; border: 1px solid #333; }
svg circle { cursor: default; }
svg circle:hover { stroke-width: 2; }
@media print { body { margin: 0; } }
</style>
</head>
<body>
<h1>ramen-cve quadrant report</h1>
<p class="meta">CVSS (severity) × EPSS (30-day exploitation probability). Points coloured by triage bucket; hover for CVE id.</p>
<div class="chart">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="CVSS by EPSS quadrant chart">
<rect class="plot-frame" x="70" y="40" width="590" height="440" fill="none" stroke="#cccccc" stroke-width="1"/>
<line class="threshold cvss-threshold" x1="483.0" y1="40" x2="483.0" y2="480" stroke="#cccccc" stroke-dasharray="4,2" stroke-width="1"/>
<line class="threshold epss-threshold" x1="70" y1="436.0" x2="660" y2="436.0" stroke="#cccccc" stroke-dasharray="4,2" stroke-width="1"/>
<text class="threshold-label" x="483.0" y="34" text-anchor="middle" font-size="10" fill="#666666">CVSS=7</text>
<text class="threshold-label" x="664" y="436.0" text-anchor="start" font-size="10" fill="#666666" dy="0.35em">EPSS=0.1</text>
<text class="axis-label x-axis" x="365.0" y="510" text-anchor="middle" font-size="12" fill="#333333">CVSS</text>
<text class="axis-label y-axis" x="30.0" y="260.0" text-anchor="middle" font-size="12" fill="#333333" transform="rotate(-90 30.0 260.0)">EPSS</text>
<text class="tick x-tick" x="70.0" y="494" text-anchor="middle" font-size="9" fill="#666666">0</text>
<text class="tick x-tick" x="188.0" y="494" text-anchor="middle" font-size="9" fill="#666666">2</text>
<text class="tick x-tick" x="306.0" y="494" text-anchor="middle" font-size="9" fill="#666666">4</text>
<text class="tick x-tick" x="424.0" y="494" text-anchor="middle" font-size="9" fill="#666666">6</text>
<text class="tick x-tick" x="542.0" y="494" text-anchor="middle" font-size="9" fill="#666666">8</text>
<text class="tick x-tick" x="660.0" y="494" text-anchor="middle" font-size="9" fill="#666666">10</text>
<text class="tick y-tick" x="64" y="480.0" text-anchor="end" font-size="9" fill="#666666" dy="0.35em">0</text>
<text class="tick y-tick" x="64" y="370.0" text-anchor="end" font-size="9" fill="#666666" dy="0.35em">0.25</text>
<text class="tick y-tick" x="64" y="260.0" text-anchor="end" font-size="9" fill="#666666" dy="0.35em">0.5</text>
<text class="tick y-tick" x="64" y="150.0" text-anchor="end" font-size="9" fill="#666666" dy="0.35em">0.75</text>
<text class="tick y-tick" x="64" y="40.0" text-anchor="end" font-size="9" fill="#666666" dy="0.35em">1</text>
<circle class="cve cve-kev_override" cx="660.0" cy="50.7" r="6" fill="#440154" fill-opacity="0.75" stroke="#333333" stroke-width="0.5"><title>CVE-2021-44228 — CVSS 10.0, EPSS 0.9757 (kev_override)</title></circle>
<circle class="cve cve-patch_now" cx="648.2" cy="65.0" r="6" fill="#3b528b" fill-opacity="0.75" stroke="#333333" stroke-width="0.5"><title>CVE-2021-26855 — CVSS 9.8, EPSS 0.9432 (patch_now)</title></circle>
<circle class="cve cve-plan_and_patch" cx="553.8" cy="471.9" r="6" fill="#5ec962" fill-opacity="0.75" stroke="#333333" stroke-width="0.5"><title>CVE-2024-0002 — CVSS 8.2, EPSS 0.0184 (plan_and_patch)</title></circle>
<circle class="cve cve-watch_closely" cx="388.6" cy="206.8" r="6" fill="#21918c" fill-opacity="0.75" stroke="#333333" stroke-width="0.5"><title>CVE-2024-0003 — CVSS 5.4, EPSS 0.6210 (watch_closely)</title></circle>
<circle class="cve cve-deprioritize" cx="323.7" cy="479.8" r="6" fill="#fde725" fill-opacity="0.75" stroke="#333333" stroke-width="0.5"><title>CVE-2024-0001 — CVSS 4.3, EPSS 0.0004 (deprioritize)</title></circle>
</svg>
</div>
<ul class="legend">
        <li><span class="swatch" style="background:#440154"></span>kev_override (1)</li>
        <li><span class="swatch" style="background:#3b528b"></span>patch_now (1)</li>
        <li><span class="swatch" style="background:#21918c"></span>watch_closely (1)</li>
        <li><span class="swatch" style="background:#5ec962"></span>plan_and_patch (1)</li>
        <li><span class="swatch" style="background:#fde725"></span>deprioritize (1)</li>
</ul>
</body>
</html>
