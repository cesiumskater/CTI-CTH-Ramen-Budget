name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check threat_intel_hunter.py conftest.py src/ tests/

      - name: Import-style guard (refactor invariant 5.1)
        run: |
          # patch("ramen_cve.requests.get") / ("ramen_cve.time.sleep") only
          # keep working if every submodule resolves these via the shared
          # module object. `from requests import get` / `from time import
          # sleep` would bind a private name the patch can't reach.
          if grep -rnE '^[[:space:]]*from (requests|time) import' src/ramen_cve/; then
            echo "::error::Use 'import requests' / 'import time' with qualified calls (see docs/REFACTOR_PLAN.md §5.1)."
            exit 1
          fi

      - name: Pytest
        run: pytest tests/ -q
