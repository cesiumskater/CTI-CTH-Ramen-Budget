name: CI

on:
  push:
  pull_request:

# Cancel an in-flight run of this workflow when the same branch / PR receives
# a newer push. Saves runner minutes; the latest commit is the one that
# matters anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run every Python in parallel; one red version doesn't cancel the
      # others, so a Py3.12-specific regression surfaces the same run.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip wheel + http cache between runs so a transient or
          # rate-limited PyPI fetch doesn't sink the whole job. Keyed off
          # pyproject.toml (where dependencies + [dev] extras live).
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          # --retries / --timeout add resilience against intermittent
          # PyPI / runner-egress flakes (refactor lessons.md L2).
          pip install --retries 5 --timeout 30 -e ".[dev]"

      - name: Ruff
        run: ruff check threat_intel_hunter.py conftest.py src/ tests/ scripts/

      - name: Import-style guard (refactor invariant 5.1)
        run: |
          # patch("ramen_cve.requests.get") / ("ramen_cve.time.sleep") only
          # keep working if every submodule resolves these via the shared
          # module object. `from requests import get` / `from time import
          # sleep` would bind a private name the patch can't reach.
          if grep -rnE '^[[:space:]]*from (requests|time) import' src/ramen_cve/; then
            echo "::error::Use 'import requests' / 'import time' with qualified calls (see src/ramen_cve/__init__.py)."
            exit 1
          fi

      - name: Pytest
        run: pytest tests/ -q

      - name: Byte-oracle (showcase bundle)
        run: python scripts/regen_examples.py --check

      - name: OPML feed bundle validator
        # Structural check on the committed examples/*.opml files: well-formed
        # XML, HTTPS xmlUrl, required `text` + `xmlUrl` attributes. Stdlib
        # only — fast, offline, deterministic.
        run: python scripts/validate_feeds.py

  # ----- Advisory jobs -------------------------------------------------------
  # These run in parallel with `test` but do NOT block merges. `continue-on-error`
  # makes a non-zero exit visible in the CI summary without failing the workflow
  # — matches the documented charter (no enforced typing; no auto-blocking on
  # dependency advisories).

  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install (editable + dev extras + mypy)
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 30 -e ".[dev]" mypy
      - name: mypy --ignore-missing-imports
        # Lenient: third-party stubs aren't part of the dep budget. Errors
        # surface in the CI summary but do not block. See docs/ROADMAP.md
        # for the type-strictness trajectory.
        id: mypy
        run: |
          set +e
          mypy src/ramen_cve --ignore-missing-imports | tee mypy.out
          rc=${PIPESTATUS[0]}
          tail_summary=$(tail -1 mypy.out)
          {
            echo "### mypy (advisory)"
            echo ""
            echo "> Charter: type hints are present for readability; mypy-strictness"
            echo "> is not enforced (docs/ROADMAP.md). This job is **advisory**."
            echo ""
            echo "**Result:** \`$tail_summary\` (rc=$rc)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 30 pip-audit
      - name: Audit declared runtime dependencies
        # Audit the pinned runtime requirements mirror. `-r` is what makes
        # `pip-audit` audit the manifest rather than the active environment
        # — without it the tool drops back to the interpreter and tries to
        # audit ramen-cve itself (an editable local install) which is
        # noisy and not what we want. --strict turns informational findings
        # (e.g. skipped editables) into non-zero exits; the job remains
        # continue-on-error so a fresh advisory is surfaced, not blocking.
        id: audit
        run: |
          set +e
          pip-audit --strict -r config/requirements.txt | tee audit.out
          rc=${PIPESTATUS[0]}
          # Last non-empty line is pip-audit's "Found N vulnerabilities…" /
          # "No known vulnerabilities found" summary.
          summary=$(awk 'NF{last=$0} END{print last}' audit.out)
          {
            echo "### pip-audit (advisory)"
            echo ""
            echo "> Vulnerability scan over \`config/requirements.txt\`. This job"
            echo "> is **advisory** — fresh advisories surface here for the"
            echo "> maintainer to triage, but don't auto-block PRs."
            echo ""
            echo "**Result:** \`$summary\` (rc=$rc)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # ----- Docker image build --------------------------------------------------
  # NOT advisory — a broken Dockerfile is a broken release. Buildx is enabled
  # so we get layer caching across runs.

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Build, don't push — registry credentials live behind tag-based
          # releases (release.yml), not every PR.
          push: false
          load: true
          tags: ramen-cve:ci
          # Layer cache keyed off the run; subsequent runs reuse it.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — --version + --help + subcommand routing
        run: |
          docker run --rm ramen-cve:ci --version
          docker run --rm ramen-cve:ci --help | head -5
          # hunt list reads the bundled JSON — proves package data is
          # actually inside the image, not just the wheel metadata.
          docker run --rm ramen-cve:ci hunt list
