name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # Cache the pip wheel + http cache between runs so a transient or
          # rate-limited PyPI fetch doesn't sink the whole job. Keyed off
          # pyproject.toml (where dependencies + [dev] extras live).
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          # --retries / --timeout add resilience against intermittent
          # PyPI / runner-egress flakes (refactor lessons.md L2).
          pip install --retries 5 --timeout 30 -e ".[dev]"

      - name: Ruff
        run: ruff check threat_intel_hunter.py conftest.py src/ tests/

      - name: Import-style guard (refactor invariant 5.1)
        run: |
          # patch("ramen_cve.requests.get") / ("ramen_cve.time.sleep") only
          # keep working if every submodule resolves these via the shared
          # module object. `from requests import get` / `from time import
          # sleep` would bind a private name the patch can't reach.
          if grep -rnE '^[[:space:]]*from (requests|time) import' src/ramen_cve/; then
            echo "::error::Use 'import requests' / 'import time' with qualified calls (see docs/REFACTOR_PLAN.md §5.1)."
            exit 1
          fi

      - name: Pytest
        run: pytest tests/ -q
