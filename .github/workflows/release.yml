name: Release

# Triggered by pushing a vX.Y.Z tag (e.g. `git tag v0.3.0 && git push origin
# v0.3.0`). The tag's commit must already be on `main` and the full CI gate
# must already be green on that commit — this workflow does not re-run tests
# (the test matrix on the source commit is the contract; release builds the
# artefacts that contract proved).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create the GitHub Release and upload artefacts

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # We never publish a dirty tree, but tags can point at a commit
          # whose CHANGELOG link refs back to compare/<prev>...<tag>.
          # Full history makes those links resolvable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Verify tag matches pyproject [project] version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pyver=$(python -c "import re,pathlib; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "$tag" != "$pyver" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pyver. Bump pyproject.toml + src/ramen_cve/cli.py::VERSION first."
            exit 1
          fi
          # tests/test_smoke.py::test_version_constant_matches_pyproject
          # already locks cli.VERSION == pyproject.version; this re-check
          # catches a tag that bypassed local CI entirely.
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing v$tag."

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 30 build

      - name: Build sdist + wheel
        run: python -m build

      - name: Smoke-install built wheel
        # Build correctness is what matters at release time. Spin up a fresh
        # venv, install the wheel, and confirm the console script is on PATH
        # and prints --version. Catches packaging mistakes (missing
        # entry-points, missing package data) that twine check wouldn't.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          /tmp/smoke/bin/pip install requests feedparser python-dotenv questionary PyYAML
          /tmp/smoke/bin/ramen-cve --version

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Short retention — these are also attached to the GitHub Release.
          retention-days: 7

  github-release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract section for this version from CHANGELOG.md
        id: changelog
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          # Awk extracts the lines between `## [<version>]` (inclusive of the
          # following content) and the next `## [` heading. Falls back to a
          # one-line stub if there's no matching section yet.
          body=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/      { capture=0 }
            capture                  { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="See CHANGELOG.md for the full history."
          fi
          {
            echo "body<<__END__"
            echo "$body"
            echo ""
            echo "---"
            echo "Built artefacts: sdist + wheel attached below."
            echo "__END__"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release with built artefacts
        uses: softprops/action-gh-release@v2
        with:
          # Draft so the maintainer can sanity-check the body / artefacts
          # before announcing. Set `draft: false` here if you'd rather it
          # publish unattended.
          draft: true
          name: "ramen-cve v${{ needs.build.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: true

  # PyPI publishing via trusted publishing (OIDC) — disabled by default.
  # To activate:
  #   1. Claim the PyPI project name (`ramen-cve`).
  #   2. Add a trusted publisher in PyPI Project Settings → Publishing:
  #        Owner:      cesiumskater
  #        Repository: cti-cth-ramen-budget
  #        Workflow:   release.yml
  #        Environment: pypi   (matches `environment:` below)
  #   3. Delete the `if: false` guard on this job.
  # No long-lived API token needed; OIDC mints a short-lived credential
  # at publish time. See https://docs.pypi.org/trusted-publishers/.
  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    if: false   # ← flip to `${{ startsWith(github.ref, 'refs/tags/v') }}` when claimed
    environment:
      name: pypi
      url: https://pypi.org/p/ramen-cve
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
